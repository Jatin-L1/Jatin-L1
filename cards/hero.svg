@keyframes growy{from{transform:scaleY(0)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
